name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - 'fastlane/metadata/android/preview-site/**'
      - 'scripts/stage_pages.py'
  workflow_dispatch:

# Shared with preview.yml: one Pages deployment at a time, never cancelled
# half-way (cancelling a deploy could drop the preview builds from the site).
concurrency:
  group: xmd-pages
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

env:
  KEEP_PREVIEWS: 3

jobs:
  deploy-site:
    name: Publish site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Pages replaces the whole site on every deploy, so the current preview
      # builds are pulled back from the live site and re-published with it.
      - name: Stage site
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          python3 scripts/stage_pages.py \
            --out site \
            --repo "$GITHUB_REPOSITORY" \
            --site-url "https://${owner}.github.io/${repo_name}" \
            --keep "$KEEP_PREVIEWS"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
