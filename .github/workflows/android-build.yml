name: Android build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & sign release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build unsigned release APK
        shell: bash
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Sign release APK
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$apksigner"

          if [[ -z "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "KEYSTORE_BASE64 is not set (expected for fork PRs); leaving APK unsigned."
            exit 0
          fi

          if [[ -z "${{ secrets.KEY_ALIAS }}" || -z "${{ secrets.KEYSTORE_PASSWORD }}" || -z "${{ secrets.KEY_PASSWORD }}" ]]; then
            echo "KEYSTORE_BASE64 is set but KEY_ALIAS / KEYSTORE_PASSWORD / KEY_PASSWORD are missing."
            exit 1
          fi

          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
          trap 'rm -f release.jks' EXIT

          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed="app/build/outputs/apk/release/app-release.apk"

          if [[ ! -f "$unsigned" ]]; then
            echo "Missing expected unsigned APK: $unsigned"
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi

          "$apksigner" sign \
            --ks release.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out "$signed" \
            "$unsigned"
          rm -f "$unsigned"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          apk="app/build/outputs/apk/release/app-release.apk"
          if [[ -f "$apk" ]]; then
            "$apksigner" verify --verbose --print-certs "$apk"
          else
            echo "No signed APK found -- skipping verification (unsigned build)."
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Xmd-release-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
